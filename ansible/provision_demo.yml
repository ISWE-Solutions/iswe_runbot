---
# Ansible playbook to provision ISWE Meal Addons demo instance
# Creates LXC container, installs Odoo 19, and configures modules

- name: Provision ISWE Meal Addons Demo Instance
  hosts: localhost
  gather_facts: yes
  vars:
    # These vars should be passed via extra-vars
    instance_id: "{{ instance_id }}"
    odoo_modules: "{{ odoo_modules | default(['meal', 'dhis2_connector']) }}"
    odoo_admin_password: "{{ odoo_admin_password }}"
    proxmox_node: "{{ proxmox_node | default('auto') }}"
    container_vmid: "{{ container_vmid | default('auto') }}"
    
    # Proxmox settings from environment
    proxmox_host: "{{ lookup('env', 'PROXMOX_HOST') }}"
    proxmox_user: "{{ lookup('env', 'PROXMOX_USER') }}"
    proxmox_password: "{{ lookup('env', 'PROXMOX_PASSWORD') }}"
    
    # Container settings
    container_ostemplate: "local:vztmpl/ubuntu-22.04-standard_22.04-1_amd64.tar.zst"
    container_storage: "local-lvm"
    container_memory: 4096
    container_swap: 512
    container_cores: 2
    container_disk: 20
    container_bridge: "vmbr0"
    
    # Odoo settings
    odoo_version: "19.0"
    odoo_port: 8069
    odoo_db_name: "demo"
    odoo_user: "odoo"
    
  tasks:
    - name: Select Proxmox node (if auto)
      when: proxmox_node == 'auto'
      block:
        - name: Get cluster status
          uri:
            url: "{{ proxmox_host }}/api2/json/cluster/status"
            method: GET
            validate_certs: no
            headers:
              Cookie: "PVEAuthCookie={{ proxmox_ticket }}"
          register: cluster_status
          failed_when: false
          
        - name: Use first available node
          set_fact:
            proxmox_node: "{{ cluster_status.json.data[0].name | default('pve') }}"

    - name: Get next available VMID
      uri:
        url: "{{ proxmox_host }}/api2/json/cluster/nextid"
        method: GET
        validate_certs: no
        headers:
          Cookie: "PVEAuthCookie={{ proxmox_ticket }}"
      register: next_vmid
      when: container_vmid == 'auto'
      
    - name: Set VMID
      set_fact:
        container_vmid: "{{ next_vmid.json.data | default(100) }}"
      when: container_vmid == 'auto'

    - name: Create LXC container
      proxmox:
        node: "{{ proxmox_node }}"
        api_user: "{{ proxmox_user }}"
        api_password: "{{ proxmox_password }}"
        api_host: "{{ proxmox_host | regex_replace('^https?://', '') | regex_replace(':.*$', '') }}"
        vmid: "{{ container_vmid }}"
        hostname: "{{ instance_id }}"
        ostemplate: "{{ container_ostemplate }}"
        storage: "{{ container_storage }}"
        memory: "{{ container_memory }}"
        swap: "{{ container_swap }}"
        cores: "{{ container_cores }}"
        disk: "{{ container_disk }}"
        netif: '{"net0":"name=eth0,bridge={{ container_bridge }},ip=dhcp"}'
        unprivileged: yes
        onboot: no
        state: started
        validate_certs: no
      register: container_created
      
    - name: Wait for container to be running
      wait_for:
        timeout: 30
      delegate_to: localhost

    - name: Get container IP address
      uri:
        url: "{{ proxmox_host }}/api2/json/nodes/{{ proxmox_node }}/lxc/{{ container_vmid }}/interfaces"
        method: GET
        validate_certs: no
        headers:
          Cookie: "PVEAuthCookie={{ proxmox_ticket }}"
      register: container_interfaces
      retries: 10
      delay: 5
      until: container_interfaces.json.data | selectattr('name', 'equalto', 'eth0') | selectattr('inet', 'defined') | list | length > 0
      
    - name: Extract IP address
      set_fact:
        container_ip: "{{ (container_interfaces.json.data | selectattr('name', 'equalto', 'eth0') | first).inet | regex_replace('/.*$', '') }}"

    - name: Add container to inventory
      add_host:
        name: "{{ container_ip }}"
        groups: demo_containers
        ansible_user: root
        ansible_ssh_common_args: '-o StrictHostKeyChecking=no'

    - name: Wait for SSH to be available
      wait_for:
        host: "{{ container_ip }}"
        port: 22
        timeout: 300
      delegate_to: localhost

- name: Configure container and install Odoo
  hosts: demo_containers
  gather_facts: yes
  become: yes
  vars:
    instance_id: "{{ hostvars['localhost']['instance_id'] }}"
    odoo_modules: "{{ hostvars['localhost']['odoo_modules'] }}"
    odoo_admin_password: "{{ hostvars['localhost']['odoo_admin_password'] }}"
    odoo_version: "19.0"
    odoo_port: 8069
    odoo_db_name: "demo"
    odoo_user: "odoo"
    repo_path: "/opt/odoo"
    addons_path: "/opt/odoo/iswe_meal_addons"
    
  tasks:
    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Install system dependencies
      apt:
        name:
          - python3
          - python3-pip
          - python3-venv
          - git
          - postgresql
          - postgresql-contrib
          - libpq-dev
          - python3-dev
          - libxml2-dev
          - libxslt1-dev
          - libldap2-dev
          - libsasl2-dev
          - libjpeg-dev
          - libpng-dev
          - libfreetype6-dev
          - liblcms2-dev
          - libwebp-dev
          - libtiff5-dev
          - libopenjp2-7-dev
          - zlib1g-dev
          - fonts-liberation
          - npm
          - node-less
          - wkhtmltopdf
        state: present

    - name: Create Odoo system user
      user:
        name: "{{ odoo_user }}"
        system: yes
        shell: /bin/bash
        home: /opt/odoo
        create_home: yes

    - name: Clone Odoo repository
      git:
        repo: 'https://github.com/odoo/odoo.git'
        dest: "{{ repo_path }}"
        version: "{{ odoo_version }}"
        depth: 1
      become_user: "{{ odoo_user }}"

    - name: Create Python virtual environment
      command: python3 -m venv {{ repo_path }}/venv
      args:
        creates: "{{ repo_path }}/venv"
      become_user: "{{ odoo_user }}"

    - name: Install Odoo Python dependencies
      pip:
        requirements: "{{ repo_path }}/requirements.txt"
        virtualenv: "{{ repo_path }}/venv"
      become_user: "{{ odoo_user }}"

    - name: Clone ISWE Meal Addons
      git:
        repo: 'https://github.com/ISWE-Solutions/iswe_meal_addons.git'
        dest: "{{ addons_path }}"
        version: main
      become_user: "{{ odoo_user }}"

    - name: Start PostgreSQL service
      systemd:
        name: postgresql
        state: started
        enabled: yes

    - name: Create PostgreSQL user for Odoo
      postgresql_user:
        name: "{{ odoo_user }}"
        password: "{{ odoo_admin_password }}"
        role_attr_flags: CREATEDB
      become_user: postgres

    - name: Create Odoo configuration directory
      file:
        path: /etc/odoo
        state: directory
        mode: '0755'

    - name: Create Odoo configuration file
      template:
        src: odoo.conf.j2
        dest: /etc/odoo/odoo.conf
        owner: "{{ odoo_user }}"
        group: "{{ odoo_user }}"
        mode: '0640'

    - name: Create Odoo log directory
      file:
        path: /var/log/odoo
        state: directory
        owner: "{{ odoo_user }}"
        group: "{{ odoo_user }}"
        mode: '0755'

    - name: Create systemd service file
      template:
        src: odoo.service.j2
        dest: /etc/systemd/system/odoo.service
        mode: '0644'

    - name: Reload systemd
      systemd:
        daemon_reload: yes

    - name: Start Odoo service
      systemd:
        name: odoo
        state: started
        enabled: yes

    - name: Wait for Odoo to be ready
      wait_for:
        port: "{{ odoo_port }}"
        timeout: 120

    - name: Initialize database with modules
      command: >
        {{ repo_path }}/venv/bin/python {{ repo_path }}/odoo-bin
        -c /etc/odoo/odoo.conf
        -d {{ odoo_db_name }}
        -i {{ odoo_modules | join(',') }}
        --stop-after-init
      become_user: "{{ odoo_user }}"
      args:
        chdir: "{{ repo_path }}"

    - name: Restart Odoo service
      systemd:
        name: odoo
        state: restarted

    - name: Set output facts
      set_fact:
        demo_container:
          vmid: "{{ hostvars['localhost']['container_vmid'] }}"
          node: "{{ hostvars['localhost']['proxmox_node'] }}"
          ip_address: "{{ ansible_default_ipv4.address }}"
          instance_id: "{{ instance_id }}"
          url: "http://{{ ansible_default_ipv4.address }}:{{ odoo_port }}"

    - name: Display container info
      debug:
        var: demo_container
