---
# Ansible playbook to deprovision demo instance

- name: Deprovision ISWE Meal Addons Demo Instance
  hosts: localhost
  gather_facts: no
  vars:
    instance_id: "{{ instance_id }}"
    proxmox_node: "{{ proxmox_node }}"
    container_vmid: "{{ container_vmid }}"
    proxmox_host: "{{ lookup('env', 'PROXMOX_HOST') }}"
    proxmox_user: "{{ lookup('env', 'PROXMOX_USER') }}"
    proxmox_password: "{{ lookup('env', 'PROXMOX_PASSWORD') }}"
    
  tasks:
    - name: Stop LXC container
      proxmox:
        node: "{{ proxmox_node }}"
        api_user: "{{ proxmox_user }}"
        api_password: "{{ proxmox_password }}"
        api_host: "{{ proxmox_host | regex_replace('^https?://', '') | regex_replace(':.*$', '') }}"
        vmid: "{{ container_vmid }}"
        state: stopped
        validate_certs: no
      ignore_errors: yes

    - name: Delete LXC container
      proxmox:
        node: "{{ proxmox_node }}"
        api_user: "{{ proxmox_user }}"
        api_password: "{{ proxmox_password }}"
        api_host: "{{ proxmox_host | regex_replace('^https?://', '') | regex_replace(':.*$', '') }}"
        vmid: "{{ container_vmid }}"
        state: absent
        validate_certs: no

    - name: Log deprovisioning
      debug:
        msg: "Deprovisioned instance {{ instance_id }} (VMID: {{ container_vmid }}) from node {{ proxmox_node }}"
