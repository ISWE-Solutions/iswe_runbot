# Local development (loaded automatically by `docker compose`): live source
# mounts and auto-reload for the API. Restart the worker after worker changes.
services:
  app:
    environment:
      UVICORN_EXTRA: --reload --reload-dir /app/previewer
    volumes:
      - ./previewer:/app/previewer
      - ./migrations:/app/migrations
      - ./tests:/app/tests
      - ./pytest.ini:/app/pytest.ini
      - ./alembic.ini:/app/alembic.ini
      - type: bind
        source: ${DATA_DIR:-/srv/previewer}
        target: ${DATA_DIR:-/srv/previewer}
        bind: { create_host_path: true }
  worker:
    volumes:
      - ./previewer:/app/previewer
      - /var/run/docker.sock:/var/run/docker.sock
      - type: bind
        source: ${DATA_DIR:-/srv/previewer}
        target: ${DATA_DIR:-/srv/previewer}
        bind: { create_host_path: true }
