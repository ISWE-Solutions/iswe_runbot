<div id="board-counters" class="flex flex-wrap gap-1.5 text-xs font-medium sm:ml-auto"{% if oob %} hx-swap-oob="true"{% endif %}>
  <span class="rounded-full bg-red-600 px-2.5 py-0.5 text-white" title="Builds waiting in the queue">Queued: {{ counts['queued'] }}</span>
  <span class="rounded-full bg-amber-400 px-2.5 py-0.5 text-amber-950" title="Builds in progress">Building: {{ counts['building'] }}</span>
  <span class="rounded-full bg-green-600 px-2.5 py-0.5 text-white" title="Previews running">Running: {{ counts['running'] }}</span>
  <span class="rounded-full bg-red-100 px-2.5 py-0.5 text-red-800" title="Branches whose latest build failed">Failed: {{ counts['failed'] }}</span>
</div>
