{# Combined preview settings. Needs: values, errors, versions. #}
{% from "_macros.html" import field_error with context %}
{% set input = "mt-1 block w-full rounded-md border border-gray-300 px-3 py-2 text-sm" %}
<div class="grid gap-4 sm:grid-cols-2">
  <label class="block text-sm font-medium">Name
    <input name="name" required value="{{ values.name or '' }}" placeholder="e.g. HR suite" class="{{ input }}">{{ field_error(errors, 'name') }}
  </label>
  <label class="block text-sm font-medium">Slug <span class="font-normal text-gray-500">(the preview address: &lt;slug&gt;.{{ settings.domain }})</span>
    <input name="slug" value="{{ values.slug or '' }}" placeholder="from name" class="{{ input }}">{{ field_error(errors, 'slug') }}
  </label>
  <label class="block text-sm font-medium">Odoo version
    <select name="default_odoo_version" class="{{ input }}">
      {% for v in versions %}<option value="{{ v }}" {% if v == values.default_odoo_version %}selected{% endif %}>{{ v }}</option>{% endfor %}
    </select>{{ field_error(errors, 'default_odoo_version') }}
  </label>
  <label class="block text-sm font-medium">Edition
    <select name="edition" class="{{ input }}">
      {% for e in ['community', 'enterprise'] %}<option value="{{ e }}" {% if e == values.edition %}selected{% endif %}>{{ e|capitalize }}</option>{% endfor %}
    </select>{{ field_error(errors, 'edition') }}
    <span class="mt-1 block text-xs font-normal text-gray-500">Community is blocked when a part needs Enterprise-only modules.</span>
  </label>
  <label class="block text-sm font-medium sm:col-span-2">Modules to install
    <input name="modules_to_install" value="{{ values.modules_to_install or '' }}" placeholder="blank = every module of every part" class="{{ input }}">{{ field_error(errors, 'modules_to_install') }}
  </label>
  <label class="flex items-center gap-2 text-sm font-medium sm:col-span-2">
    <input type="checkbox" name="install_demo_data" {% if values.install_demo_data in (True, 'on') %}checked{% endif %} class="h-4 w-4 rounded border-gray-300"> Install demo data
  </label>
</div>
