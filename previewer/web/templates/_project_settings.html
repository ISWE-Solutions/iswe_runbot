{% from "_macros.html" import csrf with context %}
<form method="post" action="/projects/{{ project.id }}/edit" class="space-y-6 rounded-lg border border-gray-200 bg-white p-6 shadow-sm">
  {{ csrf() }}
  <input type="hidden" hidden name="project_id" value="{{ project.id }}">
  {% include "_project_fields.html" %}
  <div class="flex items-center gap-3 border-t border-gray-100 pt-4">
    <button class="rounded-md bg-indigo-600 px-4 py-2 text-sm font-medium text-white hover:bg-indigo-700">Save</button>
  </div>
</form>
{% include "_project_access.html" %}
<form method="post" action="/projects/{{ project.id }}/delete" class="mt-6 rounded-lg border border-red-200 bg-white p-6">
  {{ csrf() }}
  <h2 class="font-semibold text-red-700">Delete project</h2>
  <p class="mt-1 text-sm text-gray-600">Removes all its branches, builds, previews, databases, filestores and logs. This cannot be undone.</p>
  <label class="mt-3 block text-sm text-gray-700">Type <code class="rounded bg-gray-100 px-1">{{ project.slug }}</code> to confirm
    <input name="confirm_slug" autocomplete="off" required pattern="{{ project.slug }}" class="mt-1 block w-full max-w-xs rounded-md border border-gray-300 px-3 py-2 text-sm">
  </label>
  <button class="mt-3 rounded-md bg-red-600 px-4 py-2 text-sm font-medium text-white hover:bg-red-700">Delete project</button>
</form>
