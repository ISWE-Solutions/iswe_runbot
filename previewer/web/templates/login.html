{% extends "base.html" %}
{% block title %}Sign in{% endblock %}
{% block content %}
<div class="mx-auto mt-16 max-w-sm">
  <div class="mb-6 flex items-center gap-2 text-lg font-semibold"><span class="inline-block h-7 w-7 rounded bg-indigo-600"></span> Odoo Previewer</div>
  <form method="post" action="/login" class="space-y-4 rounded-lg border border-gray-200 bg-white p-6 shadow-sm">
    <input type="hidden" name="csrf_token" value="{{ csrf_token(request) }}">
    <input type="hidden" name="next" value="{{ next }}">
    {% if error %}<p class="rounded bg-red-50 px-3 py-2 text-sm text-red-700">{{ error }}</p>{% endif %}
    <label class="block text-sm font-medium">Email
      <input name="email" type="email" required autofocus value="{{ email or '' }}" class="mt-1 block w-full rounded-md border border-gray-300 px-3 py-2">
    </label>
    <label class="block text-sm font-medium">Password
      <input name="password" type="password" required class="mt-1 block w-full rounded-md border border-gray-300 px-3 py-2">
    </label>
    <button class="w-full rounded-md bg-indigo-600 px-4 py-2 font-medium text-white hover:bg-indigo-700">Sign in</button>
  </form>
</div>
{% endblock %}
