{% extends "base.html" %}
{% block title %}Sign in{% endblock %}
{% block guest_header %}{% endblock %}
{% block content %}
<div class="overflow-hidden rounded-2xl border border-gray-200 bg-white shadow-lg">
  <div class="px-6 pb-5 pt-7 text-center">
    <img src="/static/img/iswe-logo.jpeg" alt="Iswe Solutions Ltd" class="mx-auto w-52">
  </div>
  <div class="brand-rule"></div>
  <div class="px-6 pb-7 pt-6 sm:px-8">
    <div class="mb-6 text-center">
      <h1 class="text-lg font-extrabold text-iswe-navy">Preview Portal</h1>
      <p class="mt-1 text-sm text-gray-500">Try every branch of your Odoo modules before it ships</p>
    </div>
    <form method="post" action="/login" class="space-y-4">
      <input type="hidden" name="csrf_token" value="{{ csrf_token(request) }}">
      <input type="hidden" name="next" value="{{ next }}">
      {% if error %}<p class="rounded-md border border-red-200 bg-red-50 px-3 py-2 text-sm text-red-700" role="alert">{{ error }}</p>{% endif %}
      <label class="block text-sm font-semibold text-gray-700">Email or username
        <input name="email" type="text" required autofocus autocomplete="username" autocapitalize="none" spellcheck="false"
               value="{{ email or '' }}"
               class="mt-1.5 block w-full rounded-md border border-gray-300 px-3 py-2.5 font-normal focus:border-indigo-600 focus:outline-none focus:ring-2 focus:ring-indigo-600/20">
      </label>
      <label class="block text-sm font-semibold text-gray-700">Password
        <input name="password" type="password" required autocomplete="current-password"
               class="mt-1.5 block w-full rounded-md border border-gray-300 px-3 py-2.5 font-normal focus:border-indigo-600 focus:outline-none focus:ring-2 focus:ring-indigo-600/20">
      </label>
      <button class="flex w-full items-center justify-center gap-2 rounded-md bg-indigo-600 px-4 py-2.5 font-semibold text-white hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-indigo-600/40">
        <i class="bi bi-box-arrow-in-right"></i> Sign in</button>
    </form>
  </div>
</div>
<p class="mt-6 text-center text-xs text-gray-400">Iswe Solutions Ltd</p>
{% endblock %}
