{% extends "base.html" %}
{% block title %}Unknown preview{% endblock %}
{% block content %}
<div class="mx-auto mt-16 max-w-lg rounded-lg border border-gray-200 bg-white p-8 text-center">
  <h1 class="text-xl font-semibold">No preview at {{ host }}</h1>
  <p class="mt-2 text-gray-600">No branch uses this address. It may have been renamed or deleted.</p>
  <a href="{{ settings.dashboard_url }}" class="mt-6 inline-block text-indigo-600 hover:underline">Go to the dashboard</a>
</div>
{% endblock %}
